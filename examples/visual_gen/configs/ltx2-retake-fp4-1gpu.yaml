# 1-GPU LTX-2 retake with a dynamically quantized NVFP4 transformer.
# The FlashInfer attention backend requires an SM120 Blackwell GPU.
pipeline: LTX2RetakePipeline
pipeline_config:
  text_encoder_path: null
  retake_prompt_conditioning_path: null
  retake_lora_path: null
  retake_lora_strength: 1.0
  retake_start_time: 2.9667
  retake_end_time: 3.9333
  retake_seed: 42
  retake_attention_backend: flashinfer_nvfp4
  # Run zero-based denoising steps 4 and 7 with the resident FP8 transformer.
  retake_fp8_linear_steps: [4, 7]
quant_config:
  quant_algo: NVFP4
  dynamic: true
attention_config:
  backend: VANILLA
parallel_config:
  cfg_size: 1
  ulysses_size: 1
cuda_graph_config:
  enable: false
