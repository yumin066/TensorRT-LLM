# 1-GPU LTX-2.3 two-stage Retake recipe for SM100/SM103. Dynamic NVFP4
# transformer linears are combined with graph-safe NVFP4 Q/K and per-head-channel
# FP8 V attention. Q/K use the Retake-scoped offline-calibrated global FP32 scale,
# allowing the resident NVFP4 transformer and shared FP8 companion to use CUDA
# Graph at both stage shapes. SM100 uses the BF16 VAE because the NVFP4 Conv3d
# kernel is SM120-specific.
pipeline_config:
  workflow: retake
  retake_fp8_linear_steps: [4, 7]
  retake_two_stage: true
  retake_spatial_upsampler_path: ""
  retake_stage2_quant: FP8
  retake_stage2_fp8_linear_steps: [2]
quant_config:
  quant_algo: NVFP4
  dynamic: true
attention_config:
  backend: CUTEDSL
  quant_attention_config:
    qk_dtype: nvfp4
    v_dtype: fp8
    v_block_size: 1
parallel_config:
  cfg_size: 1
  ulysses_size: 1
cuda_graph_config:
  enable: true
