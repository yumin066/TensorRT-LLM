# 1-GPU BF16 LTX-2 retake. Model, prompt-conditioning, and LoRA paths are
# supplied by the example CLI so this configuration is portable.
pipeline: LTX2RetakePipeline
pipeline_config:
  # The example supplies either a Gemma path or precomputed prompt conditioning.
  text_encoder_path: null
attention_config:
  backend: VANILLA
parallel_config:
  cfg_size: 1
  ulysses_size: 1
cuda_graph_config:
  enable: false
