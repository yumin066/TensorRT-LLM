# 1-GPU LTX-2.3 Retake quality recipe for SM100/SM103. Transformer linears use
# dynamic NVFP4 and FlashInfer attention uses NVFP4 Q/K with FP8 V. CUDA Graph is
# disabled because FlashInfer's dynamic per-tensor scales require an eager host
# scalar boundary. SM100 uses the BF16 VAE because the Retake NVFP4 Conv3d kernel
# is specialized for SM120/SM121.
pipeline_config:
  workflow: retake
  retake_fp8_linear_steps: [4, 7]
quant_config:
  quant_algo: NVFP4
  dynamic: true
attention_config:
  backend: FLASHINFER
  quant_attention_config:
    qk_dtype: nvfp4
    v_dtype: fp8
parallel_config:
  cfg_size: 1
  ulysses_size: 1
cuda_graph_config:
  enable: false
