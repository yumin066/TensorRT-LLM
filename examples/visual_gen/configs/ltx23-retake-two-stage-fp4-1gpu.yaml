# 1-GPU LTX-2.3 two-stage Retake: half-resolution NVFP4 denoise,
# learned 2x latent upsample, and three-step full-resolution refinement.
pipeline_config:
  workflow: retake
  retake_vae_encoder_nvfp4: true
  retake_vae_decoder_nvfp4: true
  retake_vae_encoder_nvfp4_exclude:
    - down_blocks.0.res_blocks.0.conv1
    - down_blocks.0.res_blocks.1.conv1
  retake_fp8_linear_steps: [4, 7]
  retake_two_stage: true
  # Supply this path through a config override or request extra parameter.
  retake_spatial_upsampler_path: ""
  # Stage B uses its FP8 companion only for the final low-sigma step.
  retake_stage2_quant: FP8
  retake_stage2_fp8_linear_steps: [2]
quant_config:
  quant_algo: NVFP4
  dynamic: true
attention_config:
  backend: FLASHINFER
  quant_attention_config:
    qk_dtype: nvfp4
    v_dtype: nvfp4
parallel_config:
  cfg_size: 1
  ulysses_size: 1
cuda_graph_config:
  enable: true
